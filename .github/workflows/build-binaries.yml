name: Build binaries

# Build standalone executables for Windows, Linux, and macOS.
# Triggers:
#   • pushing a version tag (v*)  -> builds all three and attaches them to a Release
#   • the "Run workflow" button    -> builds all three, downloadable as run Artifacts
# It does NOT run on ordinary commits.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create/update the Release on tag builds

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: trellix-decrypt-linux
          - os: windows-latest
            asset: trellix-decrypt-windows.exe
          - os: macos-latest
            asset: trellix-decrypt-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller trellix_decrypt.spec

      - name: Rename artifact (non-Windows)
        if: runner.os != 'Windows'
        run: mv dist/trellix-decrypt "dist/${{ matrix.asset }}"

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/trellix-decrypt.exe "dist/${{ matrix.asset }}"

      # Really start the executable (all three OSes) and load a template-rendered page
      # and a static file. `--check` alone never builds the web app, so it could not
      # catch an executable shipped without its templates/static files.
      - name: Smoke test (start the server, load a page + a static file)
        shell: bash
        run: |
          BIN="dist/${{ matrix.asset }}"
          chmod +x "$BIN" || true
          export DATA_DIR="$RUNNER_TEMP/smoke-data" WEB_HOST=127.0.0.1 WEB_PORT=18080
          mkdir -p "$DATA_DIR"
          "$BIN" > smoke.log 2>&1 &
          PID=$!
          URL=http://127.0.0.1:18080
          up=""
          for i in $(seq 1 60); do
            if curl -fsS "$URL/healthz" > /dev/null 2>&1; then up=1; break; fi
            sleep 1
          done
          if [ -z "$up" ]; then echo "server did not start:"; cat smoke.log; exit 1; fi
          curl -fsS "$URL/static/app.js" > /dev/null
          curl -fsS "$URL/static/style.css" > /dev/null
          TOKEN=$(grep -o 'setup=[A-Za-z0-9_-]*' smoke.log | head -1 | cut -d= -f2)
          curl -fsS -L -c jar.txt -b jar.txt "$URL/settings?setup=$TOKEN" | grep -q 'ex_base_url'
          echo "smoke test passed"
          kill "$PID" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

      - name: Attach to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
